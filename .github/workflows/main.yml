name: MT5 Windows Smoke Test

on:
  workflow_dispatch:

jobs:
  mt5-smoke-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install MetaTrader5

      - name: Download MetaTrader 5
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" `
            -OutFile "$env:TEMP\mt5setup.exe"

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          Start-Process `
            -FilePath "$env:TEMP\mt5setup.exe" `
            -ArgumentList "/auto" `
            -Wait

      - name: Find MT5 terminal
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files (x86)\MetaTrader 5\terminal64.exe"
          )

          $terminal = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $terminal) {
            Write-Host "Searching entire Program Files directory..."
            $terminal = Get-ChildItem `
              "C:\Program Files",
              "C:\Program Files (x86)" `
              -Filter "terminal64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $terminal) {
            throw "MetaTrader 5 terminal64.exe was not found."
          }

          Write-Host "MT5 terminal: $terminal"
          "MT5_TERMINAL_PATH=$terminal" >> $env:GITHUB_ENV

      - name: Start MT5 normally
        shell: powershell
        run: |
          Write-Host "Starting MetaTrader 5..."

          Start-Process `
            -FilePath "$env:MT5_TERMINAL_PATH"

          Write-Host "Waiting 30 seconds for MT5 to initialize..."
          Start-Sleep -Seconds 30

      - name: Run MT5 connection test
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: ${{ env.MT5_TERMINAL_PATH }}
        run: |
          python mt5_smoke_test.py
