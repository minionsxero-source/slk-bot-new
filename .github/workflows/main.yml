name: MT5 Windows Smoke Test

on:
  workflow_dispatch:

jobs:
  mt5-smoke-test:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install older MetaTrader5 Python package
      # --------------------------------------------------
      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip

          pip install MetaTrader5==5.0.5735

          python -c "import MetaTrader5 as mt5; print('MetaTrader5 package version:', mt5.__version__)"

      # --------------------------------------------------
      # 4. Download MetaTrader 5
      # --------------------------------------------------
      - name: Download MetaTrader 5
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          $output = "$env:TEMP\mt5setup.exe"

          Write-Host "Downloading MetaTrader 5..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $output

          if (-not (Test-Path $output)) {
            throw "MT5 installer was not downloaded."
          }

          Write-Host "MT5 installer downloaded successfully."

      # --------------------------------------------------
      # 5. Install MT5
      # --------------------------------------------------
      - name: Install MetaTrader 5
        shell: powershell
        run: |
          Write-Host "Installing MetaTrader 5..."

          Start-Process `
            -FilePath "$env:TEMP\mt5setup.exe" `
            -ArgumentList "/auto" `
            -Wait

          Write-Host "MT5 installation completed."

      # --------------------------------------------------
      # 6. Find terminal64.exe
      # --------------------------------------------------
      - name: Find MT5 terminal
        shell: powershell
        run: |
          Write-Host "Searching for MetaTrader 5 terminal..."

          $paths = @(
            "C:\Program Files\MetaTrader 5\terminal64.exe",
            "C:\Program Files (x86)\MetaTrader 5\terminal64.exe"
          )

          $terminal = $paths |
            Where-Object {
              Test-Path $_
            } |
            Select-Object -First 1

          if (-not $terminal) {

            Write-Host "Standard location not found."
            Write-Host "Searching Program Files..."

            $terminal = Get-ChildItem `
              "C:\Program Files",
              "C:\Program Files (x86)" `
              -Filter "terminal64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $terminal) {
            throw "MetaTrader 5 terminal64.exe was not found."
          }

          Write-Host "MT5 terminal found:"
          Write-Host $terminal

          "MT5_TERMINAL_PATH=$terminal" >> $env:GITHUB_ENV

      # --------------------------------------------------
      # 7. Start MT5 normally
      # --------------------------------------------------
      - name: Start MT5
        shell: powershell
        run: |
          Write-Host "Starting MetaTrader 5..."

          Start-Process `
            -FilePath "$env:MT5_TERMINAL_PATH"

          Write-Host "Waiting 30 seconds..."

          Start-Sleep -Seconds 30

          Write-Host "MT5 should now be running."

      # --------------------------------------------------
      # 8. Run connection diagnostic
      # --------------------------------------------------
      - name: Run MT5 connection test
        shell: powershell
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: ${{ env.MT5_TERMINAL_PATH }}

        run: |
          python mt5_smoke_test.py
