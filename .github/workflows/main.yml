name: MT5 Windows Smoke Test

on:
  workflow_dispatch:

jobs:
  mt5-smoke-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5==5.0.6180

      - name: Download MT5 installer
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "MT5 installer download failed."
          }

      - name: Install MT5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait

          Start-Sleep -Seconds 5

          $terminal = "C:\Program Files\MetaTrader 5\terminal64.exe"

          if (!(Test-Path $terminal)) {
            throw "terminal64.exe was not found."
          }

          Write-Host "MT5 found:"
          Write-Host $terminal

          "MT5_TERMINAL_PATH=$terminal" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start MT5 terminal
        shell: powershell
        run: |
          $terminal = $env:MT5_TERMINAL_PATH

          Write-Host "Starting MT5..."
          Write-Host $terminal

          Start-Process `
            -FilePath $terminal `
            -ArgumentList "/portable" `
            -WorkingDirectory (Split-Path $terminal)

          Write-Host "Waiting for MT5 to start..."

          Start-Sleep -Seconds 15

          $process = Get-Process terminal64 -ErrorAction SilentlyContinue

          if ($null -eq $process) {
            throw "MT5 terminal process is not running."
          }

          Write-Host "MT5 terminal process is running."

      - name: Run MT5 connection test
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: ${{ env.MT5_TERMINAL_PATH }}
        shell: powershell
        run: |
          python mt5_smoke_test.py
