name: MT5 Windows Smoke Test

on:
  workflow_dispatch:

jobs:
  mt5-smoke-test:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install MetaTrader5==5.0.6180

      - name: Download MT5 installer
        shell: powershell
        run: |
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Downloading MT5..."
          Invoke-WebRequest -Uri $url -OutFile $installer

          if (!(Test-Path $installer)) {
            throw "MT5 installer was not downloaded."
          }

          $size = (Get-Item $installer).Length
          Write-Host "Installer size: $size bytes"

          if ($size -lt 100000) {
            throw "Downloaded MT5 installer looks invalid."
          }

      - name: Install MT5
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\mt5setup.exe"

          Write-Host "Starting MT5 installer..."
          Start-Process `
            -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait `
            -NoNewWindow

          Start-Sleep -Seconds 5

          Write-Host "Searching for terminal64.exe..."

          $searchPaths = @(
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\MetaQuotes\Terminal",
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "C:\MT5"
          )

          $terminal = $null

          foreach ($path in $searchPaths) {
            if (Test-Path $path) {
              Write-Host "Searching: $path"

              $found = Get-ChildItem `
                -Path $path `
                -Filter "terminal64.exe" `
                -Recurse `
                -ErrorAction SilentlyContinue |
                Select-Object -First 1

              if ($found) {
                $terminal = $found
                break
              }
            }
          }

          if ($null -eq $terminal) {
            Write-Host "MT5 terminal was not found."
            Write-Host "Listing possible MT5 files..."

            Get-ChildItem `
              -Path "$env:APPDATA" `
              -Filter "terminal64.exe" `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 20 FullName

            throw "terminal64.exe was not found after MT5 installation."
          }

          Write-Host "FOUND MT5:"
          Write-Host $terminal.FullName

          "MT5_TERMINAL_PATH=$($terminal.FullName)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append `
              -Encoding utf8

      - name: Run MT5 connection test
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: ${{ env.MT5_TERMINAL_PATH }}
        shell: powershell
        run: |
          python mt5_smoke_test.py
